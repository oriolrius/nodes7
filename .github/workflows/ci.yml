name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  integration:
    # strict S7 PLC simulator (python-snap7, see test/integration/s7-sim.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run test:integration

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC): no token; provenance is attached automatically
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: npx --yes semver@7 -r '>=11.5.1' "$(npm -v)"
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish to npm (skipped if this version is already published)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish"
          else
            npm publish --access public
          fi
